<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Behance Downloader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Behance images</h1>
      <p id="status">Open a Behance project, then scan.</p>
      <label class="toggle"><input id="quick-mode" type="checkbox"> Quick mode: save to Downloads</label>
      <label class="toggle"><input id="keep-original" type="checkbox"> Keep original image names</label>
      <label class="toggle"><input id="project-folder" type="checkbox" checked> Save in a project-named folder</label>
      <button id="scan" type="button">Scan page</button>
      <button id="continue" type="button" disabled>Choose folder &amp; download</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
